<!doctype html>
<html lang="en" class="vimbre-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102A43" />
    <meta name="description" content="Vimbre keeps decisions, reasons and follow ups ready for the person taking over." />
    <title>Vimbre</title>
    <style>
      html.vimbre-booting { overflow: hidden; }
      #vimbre-boot { position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:28px;background:#102a43;color:#fff;transition:opacity 250ms ease; }
      #vimbre-boot.leaving { opacity:0;pointer-events:none; }
      .boot-brand { display:flex;align-items:center;gap:16px;font:650 44px/1.2 system-ui,sans-serif;letter-spacing:-2px; }
      .boot-mark { display:flex; }
      .boot-mark i { display:block;width:36px;height:36px;border:4px solid #2f80ed;border-radius:50%; }
      .boot-mark i+i { margin-left:-14px;border-color:#fff; }
      .boot-track { width:132px;height:3px;background:#1b3a57;border-radius:4px;overflow:hidden; }
      .boot-track i { display:block;width:100%;height:100%;background:#2f80ed;transform-origin:left;animation:boot-progress 1500ms ease-in-out infinite; }
      .boot-label { position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%); }
      @keyframes boot-progress { 0% { transform:scaleX(.1); } 70%,100% { transform:scaleX(1); } }
      @media(prefers-reduced-motion:reduce) { #vimbre-boot { transition:none; }.boot-track i { animation:none; } }
    </style>
  </head>
  <body>
    <div id="vimbre-boot" role="status" aria-live="polite"><div class="boot-brand"><span class="boot-mark" aria-hidden="true"><i></i><i></i></span>vimbre</div><span class="boot-track" aria-hidden="true"><i></i></span><span class="boot-label">Loading Vimbre</span></div>
    <script>
      (() => {
        const started = performance.now(); let finishing = false;
        const remove = () => { document.getElementById('vimbre-boot')?.remove(); document.documentElement.classList.remove('vimbre-booting'); };
        const finish = () => {
          if (finishing) return; finishing = true;
          const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
          Promise.race([fonts, new Promise(resolve => setTimeout(resolve, 1500))]).then(() => {
            setTimeout(() => { document.getElementById('vimbre-boot')?.classList.add('leaving'); setTimeout(remove, 250); }, Math.max(0, 650 - (performance.now() - started)));
          });
        };
        window.addEventListener('vimbre:ready', finish, { once:true });
        setTimeout(finish, 3000); setTimeout(remove, 5000);
      })();
    </script>
    <noscript><style>#vimbre-boot{display:none}html.vimbre-booting{overflow:auto}</style>Enable JavaScript to use Vimbre.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
