name: UI and My Day acceptance
on:
  push:
    branches: ['fix/ui-myday-20261027']
permissions:
  contents: read
concurrency:
  group: ui-myday-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-ui-myday-oct27.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-myday-oct27
          path: /tmp/vimbre-landing-oct27-*.png
          retention-days: 3
