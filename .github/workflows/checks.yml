name: Application checks
on:
  push:
    branches: [main, development, 'draft/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/build-social-image.cjs
      - name: Audit deployed public website
        if: github.ref == 'refs/heads/development'
        run: node scripts/audit-public.cjs
